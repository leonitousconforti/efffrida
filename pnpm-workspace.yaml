hoist: false
hoistPattern: []
autoInstallPeers: false
strictPeerDependencies: true
publicHoistPattern:
  - "frida"
  - "vitest"
  - "@types/*"
  - "@vitest/*"
  - "@effect/vitest"

recursiveInstall: true
dedupePeerDependents: false
linkWorkspacePackages: true
hoistWorkspacePackages: false
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: false

# The root and both templates all run `effect-tsgo patch` in their `prepare`
# script, and they all resolve to the same physical typescript install. Running
# them concurrently races on the binary swap, so keep install scripts serial.
childConcurrency: 1

packages:
  - packages/*
  - scratchpad
  - templates/agent-only
  - templates/app-and-agent

allowBuilds:
  frida: true
  esbuild: true
  '@bufbuild/buf': true

overrides:
  "@effect/docgen>typescript": "7.0.2"
  "madge>typescript": "7.0.2"

peerDependencyRules:
  ignoreMissing:
    - tsx

  # Ranges, so that Renovate's bumps don't break the lockfile update
  allowedVersions:
    typescript: "7"
    "@babel/core": "8"

# Frida's V8 runtime is built without ICU, so regexes using `\p{...}` fail to
# compile inside agents. Drop these once https://github.com/frida/frida-gum/issues/1195
# is resolved.
patchedDependencies:
  effect@4.1.0: patches/effect@4.1.0.patch
  vitest@5.0.5: patches/vitest@5.0.5.patch

minimumReleaseAgeExclude:
  - '@effect/docgen'
  - '@effect/platform-node-shared'
  - '@effect/platform-node'
  - '@effect/vitest'
  - effect
  - frida
